<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>✈️ 여행 일정 플래너</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link
    href="https://fonts.googleapis.com/css2?family=Pretendard:wght@300;400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap"
    rel="stylesheet" />

  <!-- Google Generative AI Import Map -->
  <script type="importmap">
    {
      "imports": {
        "@google/generative-ai": "https://esm.run/@google/generative-ai"
      }
    }
  </script>

  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { sans: ['Pretendard', 'Inter', 'sans-serif'] },
          colors: {
            brand: { 50: '#F0F8FF', 100: '#E0F2FE', 200: '#BAE6FD', 300: '#7DD3FC', 400: '#38BDF8', 500: '#0EA5E9', 600: '#0284C7', 700: '#0369A1' }
          },
          animation: {
            'slide-up': 'slideUp 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards',
            'fade-in': 'fadeIn 0.4s ease forwards',
            'shimmer': 'shimmer 1.5s infinite linear',
            'pulse-soft': 'pulseSoft 2s infinite',
          },
          keyframes: {
            slideUp: { '0%': { opacity: '0', transform: 'translateY(24px)' }, '100%': { opacity: '1', transform: 'translateY(0)' } },
            fadeIn: { '0%': { opacity: '0' }, '100%': { opacity: '1' } },
            shimmer: { '0%': { backgroundPosition: '-1000px 0' }, '100%': { backgroundPosition: '1000px 0' } },
            pulseSoft: { '0%, 100%': { opacity: 1 }, '50%': { opacity: 0.7 } }
          }
        }
      }
    }
  </script>

  <style>
    body {
      background: linear-gradient(145deg, #ECF5FF 0%, #F5F9FF 50%, #E8F2FB 100%);
      min-height: 100vh;
    }

    h1,
    h2,
    h3,
    p,
    span,
    label {
      color: inherit;
    }

    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }

    ::-webkit-scrollbar-thumb {
      background: #BAE6FD;
      border-radius: 20px;
    }

    .styled-scrollbar::-webkit-scrollbar {
      height: 8px;
    }

    .styled-scrollbar::-webkit-scrollbar-thumb {
      background: #94A3B8;
      border-radius: 20px;
    }

    .styled-scrollbar::-webkit-scrollbar-track {
      background: #F1F5F9;
      border-radius: 20px;
    }

    .glass-card {
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.6);
      border-radius: 28px;
      box-shadow: 0 12px 40px rgba(14, 165, 233, 0.08), 0 1px 3px rgba(0, 0, 0, 0.02);
    }

    .hero-bg {
      background: linear-gradient(135deg, #38BDF8 0%, #0EA5E9 60%, #0284C7 100%);
      position: relative;
      overflow: hidden;
    }

    .hero-bg::before {
      content: '';
      position: absolute;
      inset: 0;
      background-image: radial-gradient(circle, rgba(255, 255, 255, 0.15) 1px, transparent 1px);
      background-size: 24px 24px;
      opacity: 0.8;
    }

    .btn-gradient {
      background: linear-gradient(135deg, #38BDF8 0%, #0EA5E9 100%);
      box-shadow: 0 4px 16px rgba(14, 165, 233, 0.3);
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .btn-gradient:hover:not(:disabled) {
      transform: translateY(-2px);
      box-shadow: 0 6px 24px rgba(14, 165, 233, 0.4);
    }

    .btn-gradient:active:not(:disabled) {
      transform: translateY(0);
    }

    .btn-gradient:disabled {
      opacity: 0.5;
      background: #94A3B8;
      box-shadow: none;
      cursor: not-allowed;
    }

    /* Range Slider Styling */
    input[type=range] {
      -webkit-appearance: none;
      width: 100%;
      background: transparent;
      height: 32px;
    }

    input[type=range]:focus {
      outline: none;
    }

    input[type=range]::-webkit-slider-runnable-track {
      width: 100%;
      height: 8px;
      cursor: pointer;
      background: #E2E8F0;
      border-radius: 9999px;
      border: 1px solid #CBD5E1;
    }

    input[type=range]::-webkit-slider-thumb {
      height: 24px;
      width: 24px;
      border-radius: 50%;
      background: #0EA5E9;
      cursor: pointer;
      -webkit-appearance: none;
      margin-top: -9px;
      box-shadow: 0 2px 8px rgba(14, 165, 233, 0.4);
      border: 3px solid #FFF;
      transition: transform 0.1s;
    }

    input[type=range]::-webkit-slider-thumb:active {
      transform: scale(1.15);
      background: #0284C7;
    }

    .slider-container {
      padding: 0 12px;
      position: relative;
    }

    .slider-track-fill {
      position: absolute;
      top: 12px;
      left: 12px;
      height: 8px;
      background: linear-gradient(90deg, #7DD3FC, #0EA5E9);
      border-radius: 9999px;
      pointer-events: none;
      z-index: 1;
    }

    .slider-dots {
      position: absolute;
      top: 14px;
      left: 16px;
      right: 16px;
      display: flex;
      justify-content: space-between;
      pointer-events: none;
      z-index: 2;
    }

    .slider-dot {
      width: 4px;
      height: 4px;
      background: #fff;
      border-radius: 50%;
      opacity: 0.8;
    }

    .shimmer-bg {
      background: linear-gradient(90deg, #E0F2FE 25%, #F0F8FF 50%, #E0F2FE 75%);
      background-size: 1000px 100%;
    }
  </style>
</head>

<body>
  <div id="root"></div>

  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
